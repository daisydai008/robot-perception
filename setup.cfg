[metadata]
name = robot-perception
version = 0.1.0
description = Offline calibration and fixed-camera extrinsics workbench
long_description = file: README.md
long_description_content_type = text/markdown
license = Unspecified; local migration only, publication requires owner approval

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.21,<2
    opencv-contrib-python>=4.5,<5
    scipy>=1.8,<2

[options.packages.find]
where = src

[options.package_data]
robot_perception.calibration = targets.example.json

[options.extras_require]
ui =
    PyQt5>=5.15,<6

[options.entry_points]
console_scripts =
    robot-calibrate = robot_perception.calibration.calibrate:main
    robot-extrinsics-ui = robot_perception.calibration.extrinsics_ui:main
